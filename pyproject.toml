[project]
name = 'api-challenges'
version = '0.1.0'
description = 'REST API test automation for API Challenges'
readme = 'README.md'
requires-python = '>=3.12'
dependencies = [
    'httpx>=0.27',              # HTTP-клиент для наших запросов
    'pydantic-settings>=2.4',   # читает конфиг из env/.env
    'python-dotenv>=1.0',       # поддержка файла .env
]

[dependency-groups]
dev = [
    'pytest>=8.3',
    'ruff>=0.6',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/api_challenges']

[tool.ruff]
line-length = 100
target-version = 'py312'
src = ['src', 'tests']

[tool.ruff.lint]
select = ['E', 'F', 'I', 'UP']

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['src']            # чтобы pytest видел api_challenges
markers = [                     # объявляем маркеры, чтобы не ругался
    'smoke: quick checks',
    'regression: full suite',
    'negative: negative scenarios',
]
addopts = '-ra --strict-markers'